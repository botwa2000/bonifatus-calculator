version: "3.8"

services:
  app:
    image: bonifatus:dev
    ports:
      - "3001:3000"
    secrets:
      - dev_DATABASE_URL
      - dev_NEXTAUTH_SECRET
      - dev_MOBILE_JWT_SECRET
      - dev_MOBILE_APP_SECRET
      - dev_TURNSTILE_SECRET_KEY
      - dev_GOOGLE_CLIENT_ID
      - dev_GOOGLE_CLIENT_SECRET
      - dev_EMAIL_HOST
      - dev_EMAIL_PORT
      - dev_EMAIL_SECURE
      - dev_EMAIL_USER
      - dev_EMAIL_PASSWORD
      - dev_FMP_API_KEY
      - dev_STATS_ADMIN_EMAILS
      - dev_STATS_ADMIN_KEY
      - dev_ASC_ISSUER_ID
      - dev_ASC_KEY_ID
      - dev_ASC_PRIVATE_KEY
      - dev_ASC_VENDOR_NUMBER
      - dev_PLAY_SERVICE_ACCOUNT_JSON
      - dev_PLAY_REPORTS_BUCKET
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXTAUTH_URL=https://dev.bonifatus.com
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  dev_DATABASE_URL:
    external: true
  dev_NEXTAUTH_SECRET:
    external: true
  dev_MOBILE_JWT_SECRET:
    external: true
  dev_MOBILE_APP_SECRET:
    external: true
  dev_TURNSTILE_SECRET_KEY:
    external: true
  dev_EMAIL_HOST:
    external: true
  dev_EMAIL_PORT:
    external: true
  dev_EMAIL_SECURE:
    external: true
  dev_EMAIL_USER:
    external: true
  dev_EMAIL_PASSWORD:
    external: true
  dev_FMP_API_KEY:
    external: true
  dev_STATS_ADMIN_EMAILS:
    external: true
  dev_STATS_ADMIN_KEY:
    external: true
  dev_ASC_ISSUER_ID:
    external: true
  dev_ASC_KEY_ID:
    external: true
  dev_ASC_PRIVATE_KEY:
    external: true
  dev_ASC_VENDOR_NUMBER:
    external: true
  dev_PLAY_SERVICE_ACCOUNT_JSON:
    external: true
  dev_PLAY_REPORTS_BUCKET:
    external: true
  dev_GOOGLE_CLIENT_ID:
    external: true
  dev_GOOGLE_CLIENT_SECRET:
    external: true
