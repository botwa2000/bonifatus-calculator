workflows:
  # — Flutter iOS release — manual only ————————————————————————
  # Triggered by the GitHub Actions ios-trigger job via the Codemagic API.
  # CM_CERTIFICATE_PRIVATE_KEY is injected at trigger time from the GitHub
  # secret — not stored in Codemagic.
  # Uploads the build and submits it for App Store review (released
  # automatically after approval). The marketing version comes from App Store
  # Connect, never from a pubspec bump — see scripts/asc/ios_release.py.
  # Update mobile/store/whats_new.json before each release.
  flutter-release:
    name: Bonifatus Flutter iOS — App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    triggering:
      events: []  # no automatic triggers — GitHub Actions ios-trigger job fires this

    integrations:
      app_store_connect: Bonistock ASC

    environment:
      groups:
        - bonifatus
      vars:
        APP_STORE_APPLE_ID: "6745130824"
        FLUTTER_APP_DIR: "mobile"
      flutter: stable

    scripts:
      - name: Compute CFBundleVersion (must exceed latest TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if ! echo "$LATEST" | grep -qE '^[0-9]+$'; then LATEST=0; fi
          CODE=$((LATEST + 1))
          if [ "$CODE" -le 1000 ]; then CODE=1001; fi
          echo "BUILD_CODE=$CODE" >> $CM_ENV
          echo ">>> latest TestFlight build=${LATEST}; will build CFBundleVersion=${CODE}"

      - name: Compute marketing version and What's New (from App Store Connect)
        script: |
          set -e
          # The interpreter codemagic-cli-tools runs on ships PyJWT + cryptography.
          PY=$(head -1 "$(command -v app-store-connect)" | sed 's/^#!//')
          $PY -c "import jwt" 2>/dev/null || { PY=python3; $PY -m pip install --quiet pyjwt cryptography; }
          IOS_VERSION=$($PY scripts/asc/ios_release.py version)
          echo "IOS_VERSION=$IOS_VERSION" >> $CM_ENV
          $PY scripts/asc/ios_release.py localizations "$CM_BUILD_DIR/whats_new_localizations.json"
          echo ">>> will build and submit iOS version ${IOS_VERSION}"

      - name: Get Flutter dependencies
        script: |
          cd $FLUTTER_APP_DIR
          flutter pub get

      - name: Run tests
        script: |
          cd $FLUTTER_APP_DIR
          flutter test

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch or create signing certificate & provisioning profile
        script: |
          app-store-connect fetch-signing-files dev.bonifatus.gradecalc \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @env:CM_CERTIFICATE_PRIVATE_KEY

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply signing profiles to Xcode project
        script: |
          cd $FLUTTER_APP_DIR
          xcode-project use-profiles --export-options-plist "$CM_BUILD_DIR/export_options.plist"

      - name: Install CocoaPods and run pod install
        script: |
          gem install cocoapods --no-document
          cd $FLUTTER_APP_DIR/ios
          pod install --repo-update

      - name: Build Flutter IPA
        script: |
          cd $FLUTTER_APP_DIR
          set -o pipefail
          echo ">>> building IPA ${IOS_VERSION} (${BUILD_CODE})"
          flutter build ipa --release --verbose \
            --build-name="${IOS_VERSION}" \
            --build-number="${BUILD_CODE}" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=MOBILE_APP_SECRET="${MOBILE_APP_SECRET}" \
            --export-options-plist="$CM_BUILD_DIR/export_options.plist" 2>&1 | tee "$CM_BUILD_DIR/flutter_build_ipa.log"

      - name: Upload and submit for App Store review
        script: |
          set -o pipefail
          app-store-connect publish \
            --path "$FLUTTER_APP_DIR"/build/ios/ipa/*.ipa \
            --app-store \
            --version-string "${IOS_VERSION}" \
            --release-type AFTER_APPROVAL \
            --app-store-version-localizations @file:"$CM_BUILD_DIR/whats_new_localizations.json" \
            --cancel-previous-submissions \
            --max-build-processing-wait 60 2>&1 | tee "$CM_BUILD_DIR/asc_publish.log"

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/flutter_build_ipa.log
      - /tmp/xcodebuild_logs/*.log
      - $CM_BUILD_DIR/asc_publish.log
